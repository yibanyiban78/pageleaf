<main><article><h1>潮间带观测手记</h1><address rel="author">林青</address>
<p>标记正文：退潮后，我们沿着潮线记录盐沼植物。沿岸十个样点保持相同的观测时长，以便日后对照。</p>
<h2>样点与潮线</h2>
<p id="excerpt">选区标记：<strong>观察芦苇</strong>，并沿着<a href="/reference/field-guide">样点手册</a>记录潮位。<img alt="样点草图" width="140" height="100" src="/media/map.png"></p>
<p>未选标记：晴天与阴天的记录须分开比较；未完成的样点不参与计算。选择路线时，不经过脆弱植被。</p>
<figure><img src="/media/shore.png" alt="样点全景" width="480" height="240"><figcaption>图一：盐沼样点的潮线。</figcaption></figure>
<ul><li>在同一时间窗测量。</li><li>照片保持相同方向。</li></ul>
<blockquote>每次观测都保留原始记录。</blockquote>
</article></main><aside>NOISE_ASIDE_052 推荐文章</aside><footer>NOISE_FOOTER_029 编辑部联系方式</footer></body></html>
